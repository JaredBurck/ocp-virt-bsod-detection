data:
  bsod-risk-overview.json: "{\n  \"annotations\": {\n    \"list\": [\n      {\n        \"builtIn\": 1,\n        \"datasource\": {\n          \"type\": \"grafana\",\n          \"uid\": \"-- Grafana --\"\n        },\n        \"enable\": true,\n        \"hide\": true,\n        \"iconColor\": \"rgba(0, 211, 255, 1)\",\n        \"name\": \"Annotations & Alerts\",\n        \"type\": \"dashboard\"\n      }\n    ]\n  },\n  \"description\": \"BSOD risk posture for OpenShift Virtualization Windows VMs. Surfaces BSODRisk_* PrometheusRule alerts separated by scope (VM-level, node-level), fleet readiness, storage latency trends, and guest-side metrics (windows_exporter).\",\n  \"editable\": true,\n  \"fiscalYearStartMonth\": 0,\n  \"graphTooltip\": 1,\n  \"id\": null,\n  \"links\": [\n    {\n      \"asDropdown\": false,\n      \"icon\": \"external link\",\n      \"includeVars\": false,\n      \"keepTime\": false,\n      \"tags\": [],\n      \"targetBlank\": true,\n      \"title\": \"KCS 7132512 - Storage Latency\",\n      \"type\": \"link\",\n      \"url\": \"https://access.redhat.com/solutions/7132512\"\n    },\n    {\n      \"asDropdown\": false,\n      \"icon\": \"external link\",\n      \"includeVars\": false,\n      \"keepTime\": false,\n      \"tags\": [],\n      \"targetBlank\": true,\n      \"title\": \"KCS 7141291 - Guest Crash\",\n      \"type\": \"link\",\n      \"url\": \"https://access.redhat.com/solutions/7141291\"\n    },\n    {\n      \"asDropdown\": false,\n      \"icon\": \"external link\",\n      \"includeVars\": false,\n      \"keepTime\": false,\n      \"tags\": [],\n      \"targetBlank\": true,\n      \"title\": \"KCS 7132511 - CPU/Migration\",\n      \"type\": \"link\",\n      \"url\": \"https://access.redhat.com/solutions/7132511\"\n    }\n  ],\n  \"panels\": [\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"id\": 100,\n      \"title\": \"Alert Overview\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Total count of all BSODRisk alerts currently firing across the cluster (includes VM-level, node-level, and cluster-scoped alerts).\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"mappings\": [\n            {\n              \"options\": {\n                \"0\": {\n                  \"color\": \"green\",\n                  \"text\": \"Inactive\"\n                }\n              },\n              \"type\": \"value\"\n            },\n            {\n              \"options\": {\n                \"1\": {\n                  \"color\": \"red\",\n                  \"text\": \"Firing\"\n                }\n              },\n              \"type\": \"value\"\n            }\n          ],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1\n              }\n            ]\n          },\n          \"noValue\": \"0\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 1\n      },\n      \"id\": 1,\n      \"options\": {\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"center\",\n        \"orientation\": \"horizontal\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"count(ALERTS{alertname=~\\\"BSODRisk_.*\\\", alertstate=\\\"firing\\\"}) or vector(0)\",\n          \"legendFormat\": \"{{ alertname }}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Total Firing Alerts\",\n      \"type\": \"stat\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Count of distinct BSODRisk alerts currently firing, by severity. Colors match standard severity semantics: blue=info, yellow=warning, red=critical.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"text\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              }\n            ]\n          },\n          \"noValue\": \"0\"\n        },\n        \"overrides\": [\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"info\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"blue\"\n                }\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"warning\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"orange\"\n                }\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"critical\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"red\"\n                }\n              }\n            ]\n          }\n        ]\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 1\n      },\n      \"id\": 2,\n      \"options\": {\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"center\",\n        \"orientation\": \"horizontal\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"count(ALERTS{alertname=~\\\"BSODRisk_.*\\\", alertstate=\\\"firing\\\"}) by (severity) or vector(0)\",\n          \"legendFormat\": \"{{ severity }}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Firing Alerts by Severity\",\n      \"type\": \"stat\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 7\n      },\n      \"id\": 101,\n      \"title\": \"Per-VM Risk\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Number of active BSOD risk alerts per VM. Each cell shows one VM with at least one firing alert. Color intensity: yellow=1, orange=2, red=3+. Only VM-scoped alerts appear here; node-level alerts are shown separately below.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 1\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 2\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 3\n              }\n            ]\n          },\n          \"noValue\": \"0\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 8\n      },\n      \"id\": 3,\n      \"options\": {\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"center\",\n        \"orientation\": \"auto\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"count by (name, namespace) (ALERTS{alertname=~\\\"BSODRisk_.*\\\", alertstate=\\\"firing\\\", name!=\\\"\\\"} or label_replace(ALERTS{alertname=~\\\"BSODRisk_.*\\\", alertstate=\\\"firing\\\", vm_name!=\\\"\\\"}, \\\"name\\\", \\\"$1\\\", \\\"vm_name\\\", \\\"(.*)\\\"))\",\n          \"legendFormat\": \"{{ namespace }}/{{ name }}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Per-VM Active BSOD Alerts\",\n      \"type\": \"stat\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 16\n      },\n      \"id\": 106,\n      \"title\": \"Node & Cluster Alerts\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Node-scoped BSODRisk alerts such as AMD microcode verification. These are NOT VM-specific -- they indicate risk conditions on the underlying compute node that can affect any VM scheduled there. Cluster-scoped alerts (e.g. recent migration detected) also\
    \ appear here.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 1\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 2\n              }\n            ]\n          },\n          \"noValue\": \"0\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 17\n      },\n      \"id\": 11,\n      \"options\": {\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"center\",\n        \"orientation\": \"horizontal\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"count by (node) (ALERTS{alertname=~\\\"BSODRisk_.*\\\", alertstate=\\\"firing\\\", name=\\\"\\\"})\",\n          \"legendFormat\": \"{{ node }}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Nodes with Active Risk Alerts\",\n      \"type\": \"stat\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"All currently firing BSODRisk alerts with their scope (VM name or node), severity, and alert type. Use this table to identify exactly which alerts are active and where they originate. Namespace is blank for node/cluster-scoped alerts (e.g. BSODRisk_AMDNodeRequiresMicrocodeVerification) -- those do not relate to any VM's namespace; use the Node column for those rows instead.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"custom\": {\n            \"align\": \"auto\",\n            \"displayMode\": \"auto\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": [\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"Status\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"custom.displayMode\",\n                \"value\": \"color-background-solid\"\n              },\n              {\n                \"id\": \"mappings\",\n                \"value\": [\n                  {\n                    \"type\": \"value\",\n                    \"options\": {\n                      \"preview\": {\n                        \"text\": \"PREVIEW\",\n                        \"color\": \"orange\"\n                      }\n                    }\n                  },\n                  {\n                    \"type\": \"special\",\n                    \"options\": {\n                      \"match\": \"empty\",\n                      \"result\": {\n                        \"text\": \"\",\n                        \"color\": \"transparent\"\n                      }\n                    }\n                  }\n                ]\n              }\n            ]\n          }\n        ]\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 17\n      },\n      \"id\": 12,\n      \"options\": {\n        \"footer\": {\n          \"enablePagination\": false,\n          \"show\": false\n        },\n        \"showHeader\": true,\n        \"sortBy\": [\n          {\n            \"desc\": true,\n            \"displayName\": \"Severity\"\n          }\n        ]\n      },\n      \"targets\": [\n        {\n          \"expr\": \"ALERTS{alertname=~\\\"BSODRisk_.*\\\", alertstate=\\\"firing\\\"}\",\n          \"format\": \"table\",\n          \"instant\": true,\n          \"legendFormat\": \"\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"transformations\": [\n        {\n          \"id\": \"filterFieldsByName\",\n          \"options\": {\n            \"include\": {\n              \"pattern\": \"^(alertname|severity|namespace|name|node|bsod_status|Time|Value)$\"\n            }\n          }\n        },\n        {\n          \"id\": \"organize\",\n          \"options\": {\n            \"excludeByName\": {\n              \"Time\": true,\n              \"Value\": true\n            },\n            \"indexByName\": {\n              \"alertname\": 0,\n              \"severity\": 1,\n              \"namespace\": 2,\n              \"name\": 3,\n              \"node\": 4,\n              \"bsod_status\": 5\n            },\n            \"renameByName\": {\n              \"alertname\": \"Alert\",\n              \"severity\": \"Severity\",\n              \"namespace\": \"Namespace\",\n              \"name\": \"VM\",\n              \"node\": \"Node\",\n              \"bsod_status\": \"Status\"\n            }\n          }\n        }\n      ],\n      \"title\": \"All Firing Alerts (Detail)\",\n      \"type\": \"table\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Shows the CPU vendor distribution across worker nodes. A cluster with both AMD and Intel nodes is heterogeneous -- live migrations on such clusters carry elevated BSOD risk (CLOCK_WATCHDOG_TIMEOUT, MACHINE_CHECK_EXCEPTION). Uses kube_node_labels with KubeVirt cpu-vendor labels, joined against kube_node_role{role=\\\"worker\\\"} to scope to worker nodes. Requires kube-state-metrics node label allowlist (default on OCP 4.14+). Confirmed live this panel always showed 0 for both series before this fix: filtering kube_node_labels itself on label_node_role_kubernetes_io_worker=\\\"true\\\" can never match on OpenShift, because node-role.kubernetes.io/* labels are presence-only and carry an empty string value (verified via `oc get node -o jsonpath`), and Prometheus's data model treats a label with an empty value as equivalent to that label being absent -- no allowlist setting fixes this, since the label is exposed correctly, just never with the value \\\"true\\\". kube_node_role is kube-state-metrics' purpose-built metric for node roles (it parses the presence-only label into a proper role= value) and is the only reliable way to scope by role.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 1\n              }\n            ]\n          },\n          \"noValue\": \"No data (CPU-vendor labels not exposed)\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 25\n      },\n      \"id\": 13,\n      \"options\": {\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"center\",\n        \"orientation\": \"horizontal\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"count(kube_node_labels{label_cpu_vendor_node_kubevirt_io_intel=\\\"true\\\"} and on(node) kube_node_role{role=\\\"worker\\\"}) or vector(0)\",\n          \"legendFormat\": \"Intel Nodes\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"count(kube_node_labels{label_cpu_vendor_node_kubevirt_io_amd=\\\"true\\\"} and on(node) kube_node_role{role=\\\"worker\\\"}) or vector(0)\",\n          \"legendFormat\": \"AMD Nodes\",\n          \"refId\": \"B\"\n        }\n      ],\n      \"title\": \"Node CPU Vendor Distribution (R-9)\",\n      \"type\": \"stat\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Cluster CPU heterogeneity gauge from the bsod:cluster_cpu_model_count:gauge recording rule. Values: 0 = no vendor labels (allowlist not configured), 1 = homogeneous (all same vendor), 2 = heterogeneous (AMD + Intel nodes). A value of 2 means BSODRisk_HeterogeneousCPUMigration will fire on any VM live migration.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"mappings\": [\n            {\n              \"options\": {\n                \"0\": {\n                  \"color\": \"text\",\n                  \"text\": \"No Data\"\n                },\n                \"1\": {\n                  \"color\": \"green\",\n                  \"text\": \"Homogeneous\"\n                },\n                \"2\": {\n                  \"color\": \"orange\",\n                  \"text\": \"Heterogeneous\"\n                }\n              },\n              \"type\": \"value\"\n            }\n          ],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"text\",\n                \"value\": null\n              },\n              {\n                \"color\": \"green\",\n                \"value\":\
    \ 1\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 2\n              }\n            ]\n          },\n          \"noValue\": \"Recording rule not evaluated\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 25\n      },\n      \"id\": 14,\n      \"options\": {\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"center\",\n        \"orientation\": \"horizontal\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"bsod:cluster_cpu_model_count:gauge\",\n          \"legendFormat\": \"CPU Vendor Groups\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Cluster CPU Heterogeneity Status\",\n      \"type\": \"stat\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 31\n      },\n      \"id\": 102,\n      \"title\": \"Fleet Readiness\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Count of VMs with at least one active BSODRisk alert, grouped by namespace. Only VM-scoped alerts are counted (node and cluster alerts excluded).\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 1\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 3\n              }\n            ]\n          },\n          \"noValue\": \"0\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 26\n      },\n      \"id\": 4,\n      \"options\": {\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"center\",\n        \"orientation\": \"horizontal\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"count by (namespace) (count by (name, namespace) (ALERTS{alertname=~\\\"BSODRisk_.*\\\", alertstate=\\\"firing\\\", name!=\\\"\\\"} or label_replace(ALERTS{alertname=~\\\"BSODRisk_.*\\\", alertstate=\\\"firing\\\", vm_name!=\\\"\\\"}, \\\"name\\\", \\\"$1\\\", \\\"vm_name\\\", \\\"(.*)\\\"))) or vector(0)\",\n          \"legendFormat\": \"{{ namespace }}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"VMs with Active Alerts by Namespace\",\n      \"type\": \"stat\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Total running VMs tracked by KubeVirt versus those with at least one active VM-level BSOD risk alert. Note: 'Total Running VMs' includes ALL running VMIs (the KubeVirt os label is not reliably set, so Windows-only filtering is not applied here).\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 26\n      },\n      \"id\": 5,\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"center\",\n        \"orientation\": \"horizontal\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"textMode\": \"auto\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"count(kubevirt_vmi_info)\",\n          \"legendFormat\": \"Total Running VMs\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"count(count by (name, namespace) (ALERTS{alertname=~\\\"BSODRisk_.*\\\", alertstate=\\\"firing\\\", name!=\\\"\\\"} or label_replace(ALERTS{alertname=~\\\"BSODRisk_.*\\\", alertstate=\\\"firing\\\", vm_name!=\\\"\\\"}, \\\"name\\\", \\\"$1\\\", \\\"vm_name\\\", \\\"(.*)\\\"))) or vector(0)\",\n          \"legendFormat\": \"VMs at Risk\",\n          \"refId\": \"B\"\n        }\n      ],\n      \"title\": \"Fleet Summary\",\n      \"type\": \"stat\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 32\n      },\n      \"id\": 103,\n      \"title\": \"Storage Latency\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Average disk read latency per VM over time. Amber marks the 0.5s sustained WARN threshold and red the 1.0s CRITICAL threshold used by BSODRisk_StorageLatencyElevated / BSODRisk_StorageLatencyHigh. These are deliberately far below the 60s VirtIO IoTimeoutValue: what causes MEMORY_MANAGEMENT (0x1A) is a TAIL spike during a storage brownout, so an hourly mean anywhere near 60s means the guest has already bugchecked. Sourced from shared/storage-latency-thresholds.json (KCS-7132512).\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"axisCenteredZero\": false,\n            \"axisLabel\": \"Latency (seconds)\",\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"gradientMode\": \"none\",\n            \"lineInterpolation\": \"smooth\",\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\",\n            \"spanNulls\": false,\n            \"thresholdsStyle\": {\n              \"mode\": \"dashed\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 0.5\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1.0\n              }\n            ]\n          },\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 33\n      },\n      \"id\": 6,\n      \"options\": {\n        \"legend\": {\n          \"calcs\": [\n            \"mean\",\n            \"max\",\n            \"lastNotNull\"\n          ],\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum by (name, namespace, drive) (rate(kubevirt_vmi_storage_read_times_seconds_total{name=~\\\"$vm\\\"}[5m])) / sum by (name, namespace, drive) (rate(kubevirt_vmi_storage_iops_read_total{name=~\\\"$vm\\\"}[5m])) > 0\",\n          \"legendFormat\": \"{{ namespace }}/{{ name }}/{{ drive }}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"VM Disk Read Latency (avg per I/O)\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Mirrors BSODRisk_StorageLatencyTrending. Worst-direction series (max of read and write) so the panel matches the alert exactly.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"axisCenteredZero\": false,\n            \"axisLabel\": \"Ratio (1h/24h)\",\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"gradientMode\": \"none\",\n            \"lineInterpolation\": \"smooth\",\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\",\n            \"spanNulls\": false,\n            \"thresholdsStyle\": {\n              \"mode\": \"dashed\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1.5\n              }\n            ]\n          },\n          \"noValue\": \"Awaiting 24h baseline\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 41\n      },\n      \"id\": 9,\n      \"options\": {\n        \"legend\": {\n          \"calcs\": [\n            \"mean\",\n            \"max\",\n            \"lastNotNull\"\n          ],\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"bsod:vmi_disk_latency:worst_1h{name=~\\\"$vm\\\"} / bsod:vmi_disk_latency:worst_24h{name=~\\\
    \"$vm\\\"} > 0\",\n          \"legendFormat\": \"{{ namespace }}/{{ name }}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Storage Latency Trend (1h / 24h ratio, worst direction)\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 49\n      },\n      \"id\": 104,\n      \"title\": \"Memory Pressure\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Shows QEMU process RSS vs allocated domain memory. Without QGA/balloon driver, this will show ~100% (all memory pinned). With QGA, this accurately reflects guest utilization.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"axisCenteredZero\": false,\n            \"axisLabel\": \"Utilization\",\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"gradientMode\": \"none\",\n            \"lineInterpolation\": \"smooth\",\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\",\n            \"spanNulls\": false,\n            \"thresholdsStyle\": {\n              \"mode\": \"dashed\"\n            }\n          },\n          \"max\": 1,\n          \"min\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 0.85\n              }\n            ]\n          },\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 50\n      },\n      \"id\": 7,\n      \"options\": {\n        \"legend\": {\n          \"calcs\": [\n            \"mean\",\n            \"max\",\n            \"lastNotNull\"\n          ],\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"kubevirt_vmi_memory_used_bytes{name=~\\\"$vm\\\"} / on(name, namespace) kubevirt_vmi_memory_domain_bytes{name=~\\\"$vm\\\"}\",\n          \"legendFormat\": \"{{namespace}}/{{name}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Windows VM Memory Utilization (Guest / Domain)\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Windows pagefile utilization per VM (requires windows_exporter with pagefile collector). Values above 90% (yellow threshold) amplify BSOD risk when combined with slow storage.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"axisCenteredZero\": false,\n            \"axisLabel\": \"Utilization\",\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"gradientMode\": \"none\",\n            \"lineInterpolation\": \"smooth\",\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\",\n            \"spanNulls\": false,\n            \"thresholdsStyle\": {\n              \"mode\": \"dashed\"\n            }\n          },\n          \"max\": 1,\n          \"min\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 0.9\n              }\n            ]\n          },\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 58\n      },\n      \"id\": 10,\n      \"options\": {\n        \"legend\": {\n          \"calcs\": [\n            \"mean\",\n            \"max\",\n            \"lastNotNull\"\n          ],\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"(windows_pagefile_limit_bytes - windows_pagefile_free_bytes) / windows_pagefile_limit_bytes\",\n          \"legendFormat\": \"{{vm_name}} ({{file}})\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Pagefile Pressure (windows_exporter)\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 66\n      },\n      \"id\": 105,\n      \"title\": \"Driver Version Distribution (windows_exporter)\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Distribution of virtio-win driver versions across the Windows VM fleet. Requires windows_exporter with bsod-textfile-collector.ps1 deployed in guest VMs. See windows-exporter/README.md for setup.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"align\": \"auto\",\n            \"displayMode\": \"auto\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 67\n      },\n      \"id\": 8,\n      \"options\": {\n        \"footer\": {\n          \"enablePagination\": false,\n          \"show\": false\n        },\n        \"showHeader\": true,\n        \"sortBy\": [\n          {\n            \"desc\": true,\n            \"displayName\": \"Count\"\n          }\n        ]\n      },\n      \"targets\": [\n        {\n          \"expr\": \"bsod_virtio_driver_version == 1\",\n          \"format\": \"table\",\n          \"instant\": true,\n          \"legendFormat\": \"\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"transformations\": [\n        {\n          \"id\": \"organize\",\n          \"options\": {\n            \"excludeByName\": {\n              \"Time\": true,\n              \"Value\": true,\n              \"__name__\": true,\n              \"container\": true,\n              \"endpoint\": true,\n              \"instance\": true,\n              \"job\": true,\n              \"pod\": true,\n              \"prometheus\": true,\n              \"service\": true\n            },\n            \"indexByName\": {\n              \"vm_name\": 0,\n              \"vm_namespace\": 1,\n              \"version\": 2\n            },\n            \"renameByName\": {\n              \"vm_name\": \"VM\",\n              \"vm_namespace\": \"Namespace\",\n              \"version\": \"VirtIO Driver Version\"\n            }\n          }\n        }\n      ],\n      \"title\": \"VirtIO Driver Versions by VM (windows_exporter)\",\n      \"type\": \"table\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 73\n      },\n      \"id\": 108,\n      \"title\": \"Guest CPU & Memory Saturation (windows_exporter)\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Guest-observed CPU utilization (100% minus the idle-mode share of windows_cpu_time_total). Requires windows_exporter with the cpu collector (enabled by default and by install-windows-exporter.ps1). R-46: this collector was always enabled but never consumed by any downstream panel/alert before this.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"axisCenteredZero\": false,\n            \"axisLabel\": \"Utilization\",\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"gradientMode\": \"none\",\n            \"lineInterpolation\": \"smooth\",\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\",\n            \"spanNulls\": false,\n            \"thresholdsStyle\": {\n              \"mode\": \"dashed\"\n            }\n          },\n          \"max\": 100,\n          \"min\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 90\n              }\n            ]\n          },\n          \"unit\": \"percent\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 74\n      },\n      \"id\": 17,\n      \"options\": {\n        \"legend\": {\n          \"calcs\": [\n            \"mean\",\n            \"max\",\n            \"lastNotNull\"\n          ],\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"100 - (100 * avg by (vm_name, vm_namespace) (rate(windows_cpu_time_total{mode=\\\"\
    idle\\\"}[5m])))\",\n          \"legendFormat\": \"{{vm_namespace}}/{{vm_name}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Guest CPU Utilization (windows_exporter)\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"description\": \"Guest-observed physical memory utilization (100% minus free/total, from windows_exporter's memory collector). Distinct from the 'Windows VM Memory Utilization (Guest / Domain)' panel above, which is the hypervisor's ballooned-domain view. Requires windows_exporter with the memory collector (enabled by default and by install-windows-exporter.ps1). R-46: this collector was always enabled but never consumed by any downstream panel/alert before this.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"axisCenteredZero\": false,\n            \"axisLabel\": \"Utilization\",\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"gradientMode\": \"none\",\n            \"lineInterpolation\": \"smooth\",\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\",\n            \"spanNulls\": false,\n            \"thresholdsStyle\": {\n              \"mode\": \"dashed\"\n            }\n          },\n          \"max\": 100,\n          \"min\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 90\n              }\n            ]\n          },\n          \"unit\": \"percent\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 74\n      },\n      \"id\": 18,\n      \"options\": {\n        \"legend\": {\n          \"calcs\": [\n            \"mean\",\n            \"max\",\n            \"lastNotNull\"\n          ],\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"100 - (100 * windows_memory_physical_free_bytes / windows_memory_physical_total_bytes)\",\n          \"legendFormat\": \"{{vm_namespace}}/{{vm_name}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Guest Physical Memory Utilization (windows_exporter)\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Crash Detection & Risk Context\",\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 82\n      },\n      \"id\": 107,\n      \"panels\": []\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Per-VM Risk Factor Count\",\n      \"description\": \"Pre-computed BSOD risk factor count per VM (0-3). Tracks driver outdated, low IoTimeout, and crash dump disabled conditions. Higher values correlate with increased BSOD probability.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 83\n      },\n      \"id\": 15,\n      \"targets\": [\n        {\n          \"expr\": \"bsod:vm_risk_factor_count:gauge{vm_name=~\\\"$vm\\\"}\",\n          \"legendFormat\": \"{{vm_name}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 20,\n            \"spanNulls\": true,\n            \"axisSoftMin\": 0,\n            \"axisSoftMax\": 3\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 1\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 2\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 3\n              }\n            ]\n          },\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"calcs\": [\n            \"last\"\n          ],\n          \"displayMode\": \"table\",\n          \"placement\": \"right\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\"\n        }\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Crash Events (Proxy: Exporter Down)\",\n      \"description\": \"Shows windows_exporter target availability. A drop to 0 while the VMI exists indicates a potential guest crash (BSOD, unexpected reboot). Corresponds to BSODRisk_GuestUnexpectedRestart alert.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 83\n      },\n      \"id\": 16,\n      \"targets\": [\n        {\n          \"expr\": \"label_replace(up{job=~\\\"bsod-windows-exporter.*\\\", vm_name=~\\\"$vm\\\"}, \\\"name\\\", \\\"$1\\\", \\\"vm_name\\\", \\\"(.*)\\\")\",\n          \"legendFormat\": \"{{vm_name}} (up)\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"ALERTS{alertname=\\\"BSODRisk_GuestUnexpectedRestart\\\", vm_name=~\\\"$vm\\\"}\",\n          \"legendFormat\": \"{{vm_name}} ALERT\",\n          \"refId\": \"B\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 10,\n            \"spanNulls\": false\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 1\n              }\n            ]\n          },\n          \"mappings\": [\n            {\n              \"type\": \"value\",\n              \"options\": {\n                \"0\": {\n                  \"text\": \"DOWN\",\n                  \"color\": \"red\"\n                }\n              }\n            },\n            {\n              \"type\": \"value\",\n              \"options\": {\n                \"1\": {\n                  \"text\": \"UP\",\n                  \"color\": \"green\"\n                }\n              }\n            }\n          ],\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"calcs\": [\n            \"last\"\n          ],\n          \"displayMode\": \"table\",\n          \"placement\": \"right\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\"\n        }\n      }\n    }\n  ],\n  \"schemaVersion\": 39,\n  \"tags\": [\n    \"bsod\",\n    \"openshift-virtualization\",\n    \"cnv\"\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"current\": {\n          \"selected\": false,\n          \"text\": \"default\",\n          \"value\": \"default\"\n        },\n        \"hide\": 0,\n        \"includeAll\": false,\n        \"label\": \"Data Source\",\n        \"multi\": false,\n        \"name\": \"datasource\",\n        \"options\": [],\n        \"query\": \"prometheus\",\n        \"queryValue\": \"\",\n        \"refresh\": 1,\n        \"regex\": \"\",\n        \"type\": \"datasource\"\n      },\n      {\n        \"current\": {\n          \"selected\": true,\n          \"text\": \"All\",\n          \"value\": \"$__all\"\n        },\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"${datasource}\"\n        },\n        \"definition\": \"label_values(kubevirt_vmi_info, name)\",\n        \"hide\": 0,\n        \"includeAll\": true,\n        \"label\": \"VM\",\n        \"multi\": true,\n        \"name\": \"vm\",\n        \"options\": [],\n        \"query\": \"label_values(kubevirt_vmi_info, name)\",\n        \"refresh\": 2,\n        \"regex\": \"\",\n        \"sort\": 1,\n        \"type\": \"query\"\n      }\n    ]\n  },\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"timepicker\": {},\n  \"timezone\": \"\",\n  \"title\": \"BSOD Risk Overview\",\n  \"uid\": \"bsod-risk-overview\",\n  \"version\": 1\n}"
