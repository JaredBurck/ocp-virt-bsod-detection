# PersesGlobalDatasource: cluster-wide platform Thanos Querier datasource.
# See coo/README.md's "Part A: Single-Cluster Capabilities" (A2). This is a
# single-cluster feature and does NOT require RHACM/Part B.
#
# Points Perses at the SAME thanos-querier.openshift-monitoring.svc endpoint
# that dashboards/grafana-5.24.0.yaml's Grafana datasource uses (see
# dashboards/README.md Step 4) -- the same BSODRisk_* alert data, recording
# rules, and windows_exporter metrics are available either way. Trusts the
# cluster's own service CA explicitly (openshift-service-ca.crt), matching
# the dashboards/README.md / windows-exporter/README.md convention of never
# skipping TLS verification for an in-cluster, already-trusted endpoint.
#
# Requires COO 1.5+ (Perses GA) and a Secret named
# thanos-querier-datasource-secret in this namespace containing valid
# bearer-token credentials for the Thanos Querier route (same pattern as
# dashboards/README.md Step 3's grafana-sa-bearer-token Secret).
apiVersion: perses.dev/v1alpha2
kind: PersesGlobalDatasource
metadata:
  name: bsod-thanos-querier-datasource
spec:
  config:
    display:
      name: "BSOD Detection -- Platform Thanos Querier"
    default: true
    plugin:
      kind: "PrometheusDatasource"
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
            secret: thanos-querier-datasource-secret
  client:
    tls:
      enable: true
      caCert:
        type: file
        certPath: /ca/service-ca.crt
