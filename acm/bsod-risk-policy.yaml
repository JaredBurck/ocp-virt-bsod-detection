                            {
                              "expr": "label_replace(up{job=~\"bsod-windows-exporter.*\", vm_name=~\"$vm\"}, \"name\", \"$1\", \"vm_name\", \"(.*)\")",
                              "legendFormat": "{{vm_name}} (up)",
                              "refId": "A"
                            },
                            {
                              "expr": "ALERTS{alertname=\"BSODRisk_GuestUnexpectedRestart\", vm_name=~\"$vm\"}",
                              "legendFormat": "{{vm_name}} ALERT",
                              "refId": "B"
                            }
                          ],
                          "fieldConfig": {
                            "defaults": {
                              "color": {
                                "mode": "palette-classic"
                              },
                              "custom": {
                                "lineWidth": 2,
                                "fillOpacity": 10,
                                "spanNulls": false
                              },
                              "thresholds": {
                                "mode": "absolute",
                                "steps": [
                                  {
                                    "color": "red",
                                    "value": null
                                  },
                                  {
                                    "color": "green",
                                    "value": 1
                                  }
                                ]
                              },
                              "mappings": [
                                {
                                  "type": "value",
                                  "options": {
                                    "0": {
                                      "text": "DOWN",
                                      "color": "red"
                                    }
                                  }
                                },
                                {
                                  "type": "value",
                                  "options": {
                                    "1": {
                                      "text": "UP",
                                      "color": "green"
                                    }
                                  }
                                }
                              ],
                              "unit": "short"
                            },
                            "overrides": []
                          },
                          "options": {
                            "legend": {
                              "calcs": [
                                "last"
                              ],
                              "displayMode": "table",
                              "placement": "right"
                            },
                            "tooltip": {
                              "mode": "multi"
                            }
                          }
                        }
                      ],
                      "schemaVersion": 39,
                      "tags": [
                        "bsod",
                        "openshift-virtualization",
                        "cnv"
                      ],
                      "templating": {
                        "list": [
                          {
                            "current": {
                              "selected": false,
                              "text": "default",
                              "value": "default"
                            },
                            "hide": 0,
                            "includeAll": false,
                            "label": "Data Source",
                            "multi": false,
                            "name": "datasource",
                            "options": [],
                            "query": "prometheus",
                            "queryValue": "",
                            "refresh": 1,
                            "regex": "",
                            "type": "datasource"
                          },
                          {
                            "current": {
                              "selected": true,
                              "text": "All",
                              "value": "$__all"
                            },
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${datasource}"
                            },
                            "definition": "label_values(kubevirt_vmi_info, name)",
                            "hide": 0,
                            "includeAll": true,
                            "label": "VM",
                            "multi": true,
                            "name": "vm",
                            "options": [],
                            "query": "label_values(kubevirt_vmi_info, name)",
                            "refresh": 2,
                            "regex": "",
                            "sort": 1,
                            "type": "query"
                          }
                        ]
                      },
                      "time": {
                        "from": "now-6h",
                        "to": "now"
                      },
                      "timepicker": {},
                      "timezone": "",
                      "title": "BSOD Risk Overview",
                      "uid": "bsod-risk-overview",
                      "version": 1
                    }
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: bsod-risk-guest-alerts
          annotations:
            policy.open-cluster-management.io/hub-templates: raw
            policy.open-cluster-management.io/disable-templates: 'true'
        spec:
          remediationAction: inform
          severity: medium
          namespaceSelector:
            include:
              - openshift-cnv
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: monitoring.coreos.com/v1
                kind: PrometheusRule
                metadata:
                  name: bsod-risk-guest-alerts
                  namespace: openshift-cnv
                  labels:
                    prometheus: k8s
                    role: alert-rules
                    app.kubernetes.io/component: bsod-detection
                spec:
                  groups:
                    - name: bsod-risk-guest.rules
                      rules:

        # Alert: Guest-visible disk latency from windows_exporter
        # Requires: windows_exporter with logical_disk collector enabled
        # Latency derived from rate counters (no raw avg metric exists)
        # KCS: 7132512
        # [KCS-VALIDATED]
        # THRESHOLD SOURCE: shared/storage-latency-thresholds.json
        # (sustained_critical_seconds), bound by
        # scripts/ci/validate-shared-thresholds.py. H-5: this fired at 30 s/op
        # over a 5m window, far beyond the point a guest stays usable. It is a
        # 5m window (not 1h like the hypervisor rules), so it is already closer
        # to burst behaviour -- 1 s/op sustained for 10m is a real signal.
                        - alert: BSODRisk_GuestDiskLatencyHigh
                          annotations:
                            summary: "Windows VM guest-visible disk latency severely degraded"
                            description: |
                              Windows VM {{ $labels.vm_name }} reports guest-visible average disk read
                              latency of {{ $value | humanize }}s via windows_exporter, at or above the
                              1.0s severe-degradation threshold. This is measured INSIDE the guest and
                              directly reflects what the VirtIO driver experiences -- individual I/Os in
                              this regime approach the 60s IoTimeoutValue that triggers BSODs.
                            runbook_url: "https://access.redhat.com/solutions/7132512"
                            contact_first: "Red Hat (if recent platform change) / Microsoft (if no changes)"
                            stop_codes: "0x1A, 0x7A, 0x50"
                          expr: |
                            (
                              rate(windows_logical_disk_read_seconds_total{volume!~"HarddiskVolume.*"}[5m])
                              / on(instance, vm_name, volume)
                              rate(windows_logical_disk_reads_total{volume!~"HarddiskVolume.*"}[5m])
                            ) >= 1
                          for: 10m
                          labels:
                            severity: critical
                            bsod_domain: storage
                            kcs: "7132512"

        # Alert: QEMU Guest Agent service down inside Windows VM
        # Requires: windows_exporter with service collector or bsod textfile collector
                        - alert: BSODRisk_QGAServiceDown
                          annotations:
                            summary: "QEMU Guest Agent not running in Windows VM"
                            description: |
                              Windows VM {{ $labels.vm_name }} reports QEMU Guest Agent (QEMU-GA) is not
                              running. Without QGA, graceful shutdown on node drain will fail, VSS
                              snapshots are unavailable, and the VM may experience dirty shutdowns that
                              present as BSODs. Remediate: start the QEMU-GA service and set to Automatic.
                            runbook_url: "https://access.redhat.com/solutions/7128506"
                            contact_first: "Red Hat"
                          expr: |
                            bsod_qga_service_running == 0
                          for: 15m
                          labels:
                            severity: warning
                            bsod_domain: config
                            kcs: "7128506"

        # Alert: Pagefile pressure from windows_exporter
        # Requires: windows_exporter with pagefile collector enabled
        # NOTE: the pagefile collector only exposes free_bytes / limit_bytes gauges --
        # there is no pagefile "usage_bytes" series (verified against upstream
        # docs/collector.pagefile.md; see also scripts/ci/validate-metric-names.py).
        # Utilization must be derived as (limit-free)/limit, matching
        # dashboards/bsod-risk-overview.json's panel query.
                        - alert: BSODRisk_PagefilePressure
                          annotations:
                            summary: "Windows VM pagefile free space critically low"
                            description: |
                              Windows VM {{ $labels.vm_name }} has pagefile utilization above 90%.
                              Under memory pressure with slow storage, this amplifies the risk of
                              MEMORY_MANAGEMENT (0x1A) BSODs when the system cannot page out fast enough.
                            runbook_url: "https://access.redhat.com/solutions/7132512"
                            contact_first: "Microsoft (if no recent platform changes)"
                            stop_codes: "0x1A"
                          expr: |
                            ((windows_pagefile_limit_bytes - windows_pagefile_free_bytes) / windows_pagefile_limit_bytes) > 0.9
                          for: 15m
                          labels:
                            severity: warning
                            bsod_domain: resource
                            kcs: "7132512"

        # Alert: VirtIO driver version outdated (from custom textfile collector)
        # Requires: bsod-textfile-collector.ps1 running in guest with thresholds JSON
        # and OCP version (ocp-version.txt / -OCPVersion / BSOD_OCP_VERSION).
        # Preferred: stream-aware gauge bsod_virtio_driver_outdated (computed in guest
        # from shared/virtio-win-thresholds.json). Fallback: tooling floor 1.9.41 when
        # the outdated gauge is absent (older collectors).
                        - alert: BSODRisk_DriverVersionOutdated
                          annotations:
                            summary: "Windows VM has outdated VirtIO driver version"
                            description: |
                              Windows VM {{ $labels.vm_name }} reports VirtIO package version
                              {{ $labels.version }} as outdated for the cluster OCP stream.
                              Upgrade virtio-win per shared/virtio-win-thresholds.json (target often 1.9.57).
                              Confirm with Gate 15 / analyze.py if needed.
                            runbook_url: "https://access.redhat.com/solutions/7141291"
                            contact_first: "Red Hat"
                          expr: |
                            bsod_virtio_driver_outdated == 1
                            or
                            (
                              (
                                bsod_virtio_package_version == 1
                                unless on(vm_name) bsod_virtio_driver_outdated
                              )
                              unless
                              bsod_virtio_package_version{version=~"1\\.9\\.(4[1-9]|[5-9][0-9])|[2-9]\\..*"}
                            )
                          for: 0m
                          labels:
                            severity: warning
                            bsod_domain: driver
                            kcs: "7141291"

        # Alert: VM served only by the legacy (non-stream-aware) driver fallback
        # [GENERAL-KNOWLEDGE] Architect assessment Known Limitation #2 /
        # peer-review item 10: BSODRisk_DriverVersionOutdated's fallback path
        # (bsod_virtio_package_version regex floor, ~1.9.41) cannot distinguish
        # el8_6 (target 1.9.24) from el9_6 (FAIL < 1.9.53) -- it is a universal
        # floor, not a stream-aware verdict. This is not itself a BSOD risk
        # signal; it flags collector *coverage* so operators know which VMs'
        # driver verdicts are running on the older, less precise check and
        # should be upgraded to bsod-textfile-collector.ps1 (which emits the
        # stream-aware bsod_virtio_driver_outdated gauge) rather than trusting
        # the fallback's verdict as-is.
                        - alert: BSODRisk_LegacyDriverCollectorFallback
                          annotations:
                            summary: "Windows VM's driver verdict is served by the legacy, non-stream-aware fallback"
                            description: |
                              Windows VM {{ $labels.vm_name }} reports bsod_virtio_package_version but not
                              bsod_virtio_driver_outdated, meaning BSODRisk_DriverVersionOutdated (if firing
                              or not) is using the legacy universal-floor fallback (~1.9.41) rather than the
                              stream-aware verdict. The fallback cannot distinguish RHEL streams (e.g. el8_6's
                              1.9.24 target vs. el9_6's 1.9.53 FAIL threshold) and may under- or over-report.
                              Upgrade this VM's guest collector to the current bsod-textfile-collector.ps1 to
                              get the stream-aware gauge, or confirm the driver stream verdict via Gate 15 /
                              analyze.py in the meantime.
                            runbook_url: "https://access.redhat.com/solutions/7141291"
                            contact_first: "Red Hat"
                          expr: |
                            bsod_virtio_package_version unless on(vm_name) bsod_virtio_driver_outdated
                          for: 0m
                          labels:
                            severity: info
                            bsod_domain: driver
                            kcs: "7141291"

        # Alert: CrashDump disabled (from custom textfile collector)
        # Requires: bsod-textfile-collector.ps1 running in guest
                        - alert: BSODRisk_CrashDumpDisabled
                          annotations:
                            summary: "Windows VM crash dump collection disabled"
                            description: |
                              Windows VM {{ $labels.vm_name }} has CrashDumpEnabled=0. If a BSOD occurs,
                              no memory dump will be generated, making root cause analysis impossible.
                              Set CrashDumpEnabled to 7 (Automatic) or 2 (Kernel dump).
                            runbook_url: "https://access.redhat.com/solutions/7128506"
                            contact_first: "Microsoft"
                          expr: |
                            bsod_crashdump_enabled == 0
                          for: 0m
                          labels:
                            severity: warning
                            bsod_domain: config
                            kcs: "7128506"

        # Alert: Guest-observed CPU saturation (from windows_exporter's cpu collector)
        # Requires: windows_exporter with cpu collector enabled (enabled by
        # default and by install-windows-exporter.ps1's ENABLED_COLLECTORS)
        # Risk: sustained near-100% in-guest CPU competes with the same
        # scheduling-timing sensitivity BSODRisk_HostCPUContention addresses
        # from the hypervisor side (CLOCK_WATCHDOG_TIMEOUT 0x101) -- this is
        # the guest's OWN view, so it also catches saturation caused by the
        # guest's workload itself, not only host-side contention.
        # Recommendation 6 (Wave 7, R-46): install-windows-exporter.ps1 has
        # always enabled this collector, but nothing downstream consumed its
        # metrics before this -- the data was collected at the guest and
        # discarded end-to-end. See scripts/ci/validate-metric-names.py for
        # the verified metric name (windows_cpu_time_total, mode label).
        # [GENERAL-KNOWLEDGE]
        #
        # KNOWN LIMITATION (deliberate, not an oversight): this alert-only
        # implementation is the ONLY detection path for guest-observed CPU/
        # memory saturation -- there is no bsod_resource_checks.py analyzer
        # counterpart, unlike pagefile/driver-version, which also have a
        # must-gather-collected path (collect-windows-guest-info.ps1's WMI
        # snapshot) independent of whether windows_exporter/Prometheus is
        # deployed. A customer who never deploys windows_exporter (an
        # optional add-on, per windows-exporter/README.md) gets ZERO
        # CPU/memory saturation signal from an offline must-gather audit,
        # even though check_memory_pressure/check_cpu_overcommit already
        # exist in bsod_resource_checks.py for the analogous HYPERVISOR-side
        # (cAdvisor cgroup) view via runtime/cluster/vm-metrics.json and
        # node-metrics.json -- both themselves currently unpopulated by any
        # collection script (see must-gather/README.md's documented-but-not-
        # yet-collected layout). Adding a guest-reported analyzer path would
        # require a new must-gather collection step to snapshot a live
        # Thanos/Prometheus query of the windows_cpu_time_total,
        # windows_memory_physical_free_bytes, and
        # windows_memory_physical_total_bytes metrics per VM, which is out
        # of scope for R-46 as originally scoped ("no
        # additional collection or must-gather change"). Deliberately left
        # unimplemented rather than silently gapped -- revisit if a real
        # must-gather-only (no live Prometheus) audit needs this signal.
                        - alert: BSODRisk_GuestCPUSaturation
                          annotations:
                            summary: "Windows VM guest-observed CPU saturation"
                            description: |
                              Windows VM {{ $labels.vm_name }} reports {{ $value | humanize }}%
                              average CPU utilization (100% minus the idle-mode share) over the
                              last 5 minutes, sustained at or above the 90% saturation
                              threshold. Sustained near-100% CPU competes for the same
                              scheduling timing Windows guests need to avoid
                              CLOCK_WATCHDOG_TIMEOUT (0x101) BSODs. Investigate the in-guest
                              workload (Task Manager / Resource Monitor) and, if host-side
                              contention is also suspected, check BSODRisk_HostCPUContention
                              for this VM's node.
                            runbook_url: "https://access.redhat.com/solutions/7132511"
                            contact_first: "Microsoft (guest workload) / Red Hat (if host contention is also firing)"
                            stop_codes: "0x101"
                          expr: |
                            100 - (100 * avg by (vm_name, vm_namespace) (rate(windows_cpu_time_total{mode="idle"}[5m]))) > 90
                          for: 15m
                          labels:
                            severity: warning
                            bsod_domain: cpu
                            kcs: "7132511"

        # Alert: Guest-observed physical memory saturation (windows_exporter's
        # memory collector)
        # Requires: windows_exporter with memory collector enabled (enabled by
        # default and by install-windows-exporter.ps1's ENABLED_COLLECTORS)
        # Risk: Amplifies MEMORY_MANAGEMENT (0x1A) BSOD risk via pagefile
        # pressure, same as BSODRisk_MemoryPressure/BSODRisk_PagefilePressure,
        # but measured from INSIDE the guest's own physical-memory accounting
        # rather than the hypervisor's ballooned-domain view or the pagefile
        # collector specifically.
        # Recommendation 6 (Wave 7, R-46): see BSODRisk_GuestCPUSaturation's
        # comment above -- same collected-and-discarded defect, memory axis.
        # [GENERAL-KNOWLEDGE]
                        - alert: BSODRisk_GuestMemorySaturation
                          annotations:
                            summary: "Windows VM guest-observed physical memory saturation"
                            description: |
                              Windows VM {{ $labels.vm_name }} reports {{ $value | humanize }}%
                              physical memory utilization, at or above the 90% saturation
                              threshold. Sustained high physical memory pressure amplifies the
                              risk of MEMORY_MANAGEMENT (0x1A) BSODs when the system cannot
                              page out fast enough. Cross-check BSODRisk_PagefilePressure and
                              BSODRisk_MemoryPressure for this VM; if this fires without
                              either of those, pagefile/domain-level accounting may be
                              under-reporting real guest memory pressure.
                            runbook_url: "https://access.redhat.com/solutions/7132512"
                            contact_first: "Microsoft (if no recent platform changes)"
                            stop_codes: "0x1A"
                          expr: |
                            100 - (100 * windows_memory_physical_free_bytes / windows_memory_physical_total_bytes) > 90
                          for: 15m
                          labels:
                            severity: warning
                            bsod_domain: resource
                            kcs: "7132512"

        # Alert: Windows VM restarted unexpectedly (proxy for BSOD crash detection)
        # Requires: windows_exporter deployed (ServiceMonitor scraping vm_name targets)
        # Heuristic: exporter goes down while VMI still exists in KubeVirt, AND the VM
        # genuinely re-entered Running recently. Does NOT depend on
        # kubevirt_vmi_guest_os_panic_total (not yet shipping).
        #
        # v0.17.0 fix (deep-dive review F1): the original implementation was missing a
        # phase-change guard, so it fired on ANY exporter-unreachable VM (firewall,
        # exporter service stopped, etc.), not just genuine crash/restart patterns --
        # confirmed 17/21 monitored VMs false-positive on a live cluster. The roadmap's
        # originally-proposed guard, `changes(kubevirt_vmi_phase_count[10m]) > 1`, is
        # NOT usable here: `kubevirt_vmi_phase_count` is a deprecated, node/phase-scoped
        # aggregate (replaced upstream by `node:kubevirt_vmi_phase:sum`) with no
        # `name`/`namespace` labels to join on -- `and on(name, namespace)` against it
        # would always yield an empty vector, silently making the alert NEVER fire again
        # (a worse regression than the false-positive storm it was meant to fix). Uses
        # `kubevirt_vm_running_status_last_transition_timestamp_seconds` instead -- a
        # native, per-VM (name/namespace-labeled) virt-controller metric already scraped
        # by the standard OCP Virt monitoring stack (no additional guest-side dependency
        # beyond windows_exporter for the `up` term). A VM whose most recent transition
        # to Running was within the last 10 minutes has genuinely restarted recently;
        # this excludes VMs where the exporter is merely unreachable but the guest itself
        # has been Running, unchanged, for longer than that.
        # Known false positives: planned reboots (Windows Update, manual restart) within
        # the same 10-minute window still trigger this -- acceptable at warning severity.
        # Acceptable at warning severity -- operators investigate via Layer 4 scripts.
        # KCS: 7141291
        # [GENERAL-KNOWLEDGE]
                        - alert: BSODRisk_GuestUnexpectedRestart
                          annotations:
                            summary: "Windows VM restarted unexpectedly -- possible BSOD"
                            description: |
                              Windows VM {{ $labels.vm_name }}: windows_exporter target is down while the
                              VMI still exists in KubeVirt and the VM re-entered Running within the last
                              10 minutes, indicating a guest-level crash or unexpected reboot (BSOD on
                              Windows). Collect crash dump and run:
                                cnv-win-bsod-audit.sh <namespace> <vm-name>
                              If crash dump exists, open a support case with the gate report and dump.
                            runbook_url: "https://access.redhat.com/solutions/7141291"
                            contact_first: "Red Hat (if recent platform/driver change) / Microsoft (if no changes)"
                            stop_codes: "varies (check Windows minidump or virt-launcher logs)"
                          expr: |
                            (
                              label_replace(up{job=~"bsod-windows-exporter.*"} == 0, "name", "$1", "vm_name", "(.*)")
                            )
                            and on(name, namespace)
                            kubevirt_vmi_info
                            and on(name, namespace)
                            ((time() - kubevirt_vm_running_status_last_transition_timestamp_seconds) < 600)
                          for: 2m
                          labels:
                            severity: warning
                            bsod_domain: crash
                            kcs: "7141291"
