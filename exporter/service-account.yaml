# Issue K / R-27: ServiceAccount + RBAC for the evidence-completeness
# exporter (scripts/cnv-bsod-fleet-exporter.sh).
#
# DELIBERATELY REUSES the existing `bsod-audit-gate` ClusterRole from
# tekton/rbac.yaml rather than defining a second, near-identical rule set:
# the exporter runs the exact same cnv-win-bsod-audit.sh the Tekton gate
# runs, read-only, against the same resource set (VMs/VMIs/nodes/HCO/
# templates/instancetypes/preferences/plans/clusterversions) -- see
# tekton/rbac.yaml's own rule list and comments for why each entry exists.
# A separate ClusterRole here would be a second copy of that same list to
# keep in sync by hand every time a gate needs a new read permission (e.g.
# M-10's namespaced instancetype/preference addition).
#
# EXPORTER_SKIP_MICROCODE_PROBE defaults to 1 (see the exporter script's own
# header) -- Gate 8's `oc debug node/<name>` probe is never invoked by
# default, so this ServiceAccount deliberately does NOT need (and does not
# have) pods/exec or debug-pod create permissions, matching bsod-audit-gate's
# existing read-only scope exactly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bsod-fleet-exporter-sa
  namespace: openshift-cnv
  labels:
    app.kubernetes.io/component: bsod-detection
    app.kubernetes.io/part-of: bsod-fleet-exporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bsod-fleet-exporter
  labels:
    app.kubernetes.io/component: bsod-detection
    app.kubernetes.io/part-of: bsod-fleet-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # Defined in tekton/rbac.yaml -- deploy that file (or at least its
  # ClusterRole) before this one.
  name: bsod-audit-gate
subjects:
  - kind: ServiceAccount
    name: bsod-fleet-exporter-sa
    namespace: openshift-cnv
