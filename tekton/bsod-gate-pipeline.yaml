apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bsod-gated-migration
  namespace: openshift-cnv
  labels:
    app.kubernetes.io/component: bsod-detection
    app.kubernetes.io/part-of: bsod-gate
  annotations:
    tekton.dev/displayName: "BSOD-Gated Migration Pipeline"
spec:
  description: |
    Example pipeline demonstrating BSOD risk gate before migration.
    The proceed-migration task only runs if the gate verdict is PASS.
    Replace the placeholder proceed-migration task with your actual
    migration trigger (e.g. MTV Plan start, ArgoCD sync, etc.).
  params:
    - name: plan-name
      type: string
      description: "Name of the MTV Plan to audit and migrate"
    - name: plan-namespace
      type: string
      description: "Namespace of the MTV Plan"
      default: "openshift-mtv"
    - name: strict
      type: string
      description: "Enable strict mode for the gate"
      default: "true"
  tasks:
    - name: bsod-gate
      taskRef:
        name: bsod-audit-gate
      params:
        - name: plan-name
          value: "$(params.plan-name)"
        - name: plan-namespace
          value: "$(params.plan-namespace)"
        - name: strict
          value: "$(params.strict)"
    - name: proceed-migration
      runAfter:
        - bsod-gate
      when:
        - input: "$(tasks.bsod-gate.results.verdict)"
          operator: in
          values: ["PASS"]
      taskRef:
        name: noop
      params:
        - name: message
          value: |
            Gate passed ($(tasks.bsod-gate.results.fail-count) FAILs, $(tasks.bsod-gate.results.warn-count) WARNs).
            Proceeding with migration of plan $(params.plan-name).
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: noop
  namespace: openshift-cnv
  labels:
    app.kubernetes.io/component: bsod-detection
spec:
  description: "Placeholder task -- replace with actual migration trigger"
  params:
    - name: message
      type: string
      default: ""
  steps:
    - name: log
      # M2: pinned by digest -- Red Hat product registry, stable and safe to
      # pin without mirroring. Refresh via `skopeo inspect`.
      image: registry.access.redhat.com/ubi9-minimal@sha256:2a98ec380ad75004992b8538380a5003da64442f0a69237ed236859e023c71d0
      # R-04: env var, not textual interpolation -- see bsod-gate-task.yaml.
      # A placeholder task is still a real injection sink: this one is wired to
      # run on the PASS branch, so a crafted message would execute inside the
      # pipeline's SA context.
      env:
        - name: NOOP_MESSAGE
          value: "$(params.message)"
      script: |
        #!/usr/bin/env bash
        echo "$NOOP_MESSAGE"
